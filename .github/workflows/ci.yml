name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Seed + uniqueness + JS syntax
        run: bash scripts/ci-check.sh
